[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plataforma-backend"
version = "0.1.0"
description = "Plataforma SaaS unificada (Scanner + SUNAT + SIRE) — monolito modular"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.138.1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy==2.0.51",
    "psycopg2-binary==2.9.12",
    "alembic==1.18.5",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "redis>=5.0",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
    "python-jose[cryptography]==3.5.0",
    "python-multipart==0.0.32",
    "pandas==3.0.3",
    "openpyxl==3.1.5",
    "email-validator==2.3.0",
    "playwright==1.60.0",
    "google-auth>=2.30",
    "google-api-python-client>=2.130",
    "pytesseract==0.3.13",
    "opencv-python-headless==4.13.0.92",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pillow>=11",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "import-linter>=2.0",
    "ruff>=0.6",
    "moto[s3]>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
# No se lintan: migraciones autogeneradas y el motor SIRE portado verbatim
# desde sire-backend (se mantiene byte-idéntico a la fuente; ver código propio
# —orchestrator, worker— que sí se lintea).
extend-exclude = [
    "migrations",
    "src/modules/sire/infrastructure/parser",
    "src/modules/sire/infrastructure/report",
    "src/modules/sire/infrastructure/sunat",
    "src/modules/sire/infrastructure/reconciliation/engine.py",
    "src/modules/sire/infrastructure/reconciliation/worker.py",
    "src/modules/sunat/infrastructure/automation",
    "src/modules/scanner/infrastructure/utils",
    "src/modules/scanner/infrastructure/extractor",
]

[tool.ruff.lint]
# E/F: errores y pyflakes; I: orden de imports. Determinista y sin ruido idiomático.
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# ─── Fronteras de arquitectura (se verifican en CI con `lint-imports`) ───
[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "El núcleo (platform) no depende de los módulos"
type = "forbidden"
source_modules = ["src.platform"]
forbidden_modules = ["src.modules"]

[[tool.importlinter.contracts]]
name = "Los módulos de negocio no se importan entre sí"
type = "independence"
modules = ["src.modules.sire", "src.modules.sunat", "src.modules.scanner"]
